<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion des commandes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container py-4">
      <header class="mb-4">
        <h1 class="text-center fw-bold">Gestion des commandes</h1>
      </header>

      <section class="row g-3 mb-4" id="statsSection">
        <div class="col-12 col-md-6 col-xl-3">
          <div class="card stat-card shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Clients</div>
              <div class="fs-3 fw-bold" id="customerCount">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <div class="card stat-card shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Produits</div>
              <div class="fs-3 fw-bold" id="productCount">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <div class="card stat-card shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Commandes</div>
              <div class="fs-3 fw-bold" id="orderCount">0</div>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl-3">
          <div class="card stat-card shadow-sm h-100">
            <div class="card-body">
              <div class="text-muted small">Montant cumulé</div>
              <div class="fs-3 fw-bold" id="totalAmount">0,00 MAD</div>
            </div>
          </div>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-12 col-md-5">
              <label class="form-label fw-semibold" for="searchInput">Recherche par client</label>
              <input
                id="searchInput"
                type="search"
                class="form-control"
                placeholder="Nom du client..."
              />
            </div>
            <div class="col-12 col-md-3">
              <label class="form-label fw-semibold" for="statusFilter">Statut</label>
              <select id="statusFilter" class="form-select"></select>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label fw-semibold" for="categoryFilter">Catégorie</label>
              <select id="categoryFilter" class="form-select"></select>
            </div>
          </div>
        </div>
      </section>

      <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>

      <section class="card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Client</th>
                  <th>Date</th>
                  <th>Statut</th>
                  <th>Produits</th>
                  <th>Total</th>
                  <th class="text-center">Détail</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="orderDetailTitle">Détail de la commande</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body" id="orderDetailBody"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
